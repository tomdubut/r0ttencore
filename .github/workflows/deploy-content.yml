# Builds the site and uploads it to Cloudflare when content changes in Sanity, plus once a day.
# Why GitHub and not a Cloudflare deploy hook: Cloudflare's build service can stall
# ("Build failed to initialize"), and publishes were then silently lost. Here every publish
# is a visible run with logs, GitHub emails on failure, and Cloudflare only receives the
# finished files (`wrangler deploy`), which doesn't depend on its build service.
#
# Triggers:
# - repository_dispatch "sanity-publish": the Sanity webhook (sanity.io/manage → API → Webhooks)
#   POSTs to https://api.github.com/repos/tomdubut/r0ttencore/dispatches.
# - schedule: daily rebuild, so date rules (e.g. hiding "NEXT: TOKYO" once the event has passed)
#   apply even when nobody publishes.
# - workflow_dispatch: manual run (Actions → Deploy content → Run workflow).
# Code pushes are still built by Cloudflare Workers Builds (production on main, branch previews).
#
# Secrets: CLOUDFLARE_API_TOKEN (custom token: Account → Workers Scripts → Edit, this account only),
# CLOUDFLARE_ACCOUNT_ID.
# Note: GitHub pauses scheduled workflows after 60 days without commits; it emails the repo owner
# and a click on "Enable workflow" (Actions tab) turns it back on.
name: Deploy content

on:
  repository_dispatch:
    types: [sanity-publish]
  schedule:
    - cron: '15 0 * * *' # every day at 00:15 UTC (09:15 Tokyo, 01:15/02:15 Paris)
  workflow_dispatch:

# Bursts of publishes: at most one run in progress and one waiting. A newer publish replaces
# the waiting run, and since every run fetches the latest content, nothing is lost.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

# Security notes:
# - Two jobs: "build" runs the site's code and dependencies with NO secrets; "deploy" only
#   uploads the built files. The Cloudflare token exists only in the deploy step.
# - The deploy job installs packages with --ignore-scripts, so no package code runs at install time.
# - Actions are pinned to exact commits (tag in the comment), so a moved tag can't change them.
# - No pull_request trigger: forks can never reach these secrets.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: site
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: site
          path: dist/

      # Wrangler at the version locked in package-lock.json, no install scripts.
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Upload to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
